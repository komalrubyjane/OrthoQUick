<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medisux - History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        /* Styles for navbar */
        .navbar-brand img {
            height: 40px;
            width: auto;
            max-width: 150px;
            vertical-align: middle;
        }
        .navbar-brand img[src=""], 
        .navbar-brand img:not([src]) {
            width: 40px;
            background-color: #e9ecef;
        }
        .navbar {
            min-height: 60px;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
        }
        @media (max-width: 576px) {
            .navbar-brand img {
                height: 30px;
            }
            .navbar {
                min-height: 50px;
            }
        }

        /* Styles for GIFs in How It Works section */
        .how-it-works-card .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="static/uploads/logo.png" alt="Logo" class="me-2">ORTHOQUICK
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/analysis">Analysis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/difference">Difference</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://wa.me/yournumber">Contact Support</a>
                    </li>
                    <li class="nav-item">
                        <button id="dark-mode-toggle" class="btn btn-outline-secondary">Dark Mode</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- History Section -->
    <section class="history-section py-5">
        <div class="container">
            <h2 class="text-center fw-bold text-dark mb-5">Scan History</h2>
            <div class="text-end mb-3">
                <a href="/export_history" class="btn btn-warning rounded-pill px-4">Export History</a>
            </div>
            <div id="history-result" class="row justify-content-center"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white text-center py-4 text-dark">
        <p id="status" class="mb-0">{% if model_trained %}Ready{% else %}Initialization failed{% endif %}</p>
        <p class="mt-2">© 2025 ORTHOQUICK. All rights reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script src="/static/js/scripts.js"></script>
</body>
</html>
